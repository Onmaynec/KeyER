name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore src/KeyER/KeyER.csproj

      - name: Build
        run: dotnet build src/KeyER/KeyER.csproj -c Release --no-restore -warnaserror

      - name: Publish portable win-x64
        shell: pwsh
        run: |
          dotnet publish src/KeyER/KeyER.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o artifacts/portable
          Compress-Archive -Path artifacts/portable/* -DestinationPath artifacts/KeyER-v0.1.0-portable-win-x64.zip -Force

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }

      - name: Create installer
        shell: pwsh
        run: |
          $iscc = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          & $iscc 'installer/KeyER.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KeyER-portable-win-x64
          path: artifacts/KeyER-v0.1.0-portable-win-x64.zip

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KeyER-installer-win-x64
          path: artifacts/installer/KeyER-v0.1.0-Setup.exe
